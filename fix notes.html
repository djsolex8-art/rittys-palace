<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Ritty's Palace — Fix Note Text</title>
<style>
  body{font-family:sans-serif;background:#0a0a08;color:#faf6ee;padding:2rem;max-width:700px;margin:0 auto}
  h1{color:#e0b84a}
  button{background:#c8972a;color:#0a0a08;border:none;padding:1rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;margin:1rem 0}
  button:hover{background:#e0b84a}
  button:disabled{background:#555;cursor:not-allowed}
  #log{background:#1a1a16;padding:1rem;font-family:monospace;font-size:.85rem;white-space:pre-wrap;max-height:500px;overflow-y:auto;border:1px solid #333}
  .success{color:#5fd393}
  .error{color:#e08070}
  .info{color:#8fa8c4}
</style>
</head>
<body>
<h1>🔧 Fix Broken Note Text</h1>
<p>This one-time tool finds products with broken <code>\u00b7</code> style codes in their "note" field (like "Foreign sole · Local sole") and fixes them to show the proper bullet point.</p>
<button id="startBtn" onclick="startFix()">Scan &amp; Fix Notes</button>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jyltwhjgzzlaazqmzkks.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5bHR3aGpnenpsYWF6cW16a2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMDE5NDQsImV4cCI6MjA5OTY3Nzk0NH0.0H2CGUjzgi9tkIcC-9mdWUgkAdvyFd5Qz9VZDybb-X4";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// Decode any JS-style unicode escapes like \u00b7 into real characters
function fixEscapes(str) {
  if (!str) return str;
  return str.replace(/\\u([0-9a-fA-F]{4})/g, (match, hex) => {
    return String.fromCharCode(parseInt(hex, 16));
  });
}

async function startFix() {
  document.getElementById('startBtn').disabled = true;
  log('Scanning all products for broken escape codes...');

  const { data, error } = await supabaseClient.from('products').select('id, name, note');
  if (error) {
    log('ERROR fetching products: ' + error.message, 'error');
    return;
  }

  log(`Found ${data.length} total products. Checking notes...`);

  let fixedCount = 0;
  let cleanCount = 0;

  for (const p of data) {
    if (!p.note) { continue; }
    if (p.note.includes('\\u')) {
      const fixedNote = fixEscapes(p.note);
      const { error: updateErr } = await supabaseClient
        .from('products')
        .update({ note: fixedNote })
        .eq('id', p.id);

      if (updateErr) {
        log(`❌ Failed to fix "${p.name}": ${updateErr.message}`, 'error');
      } else {
        log(`✅ Fixed "${p.name}": "${p.note}" → "${fixedNote}"`, 'success');
        fixedCount++;
      }
    } else {
      cleanCount++;
    }
  }

  log(`\n=== DONE ===`);
  log(`✅ Fixed: ${fixedCount} products`, 'success');
  log(`ℹ️ Already clean: ${cleanCount} products`, 'info');
  document.getElementById('startBtn').textContent = 'Fix Complete';
}
</script>
</body>
</html>
